networks:
  grpc-net:
    driver: bridge
    
services:
  grpc-server:
    build:
      context: .
      dockerfile: grpc-server/Dockerfile
    container_name: grpc-server
    ports:
      - "9090:9090"
    networks:
      - grpc-net

  grpc-client:
    build:
      context: .
      dockerfile: grpc-client/Dockerfile
    container_name: grpc-client
    depends_on:
      - grpc-server
    environment:
      GRPC_SERVER_HOST: grpc-server
      GRPC_SERVER_PORT: "9090"
    networks:
      - grpc-net


